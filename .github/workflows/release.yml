name: release

# Build the Qt GUI + CLI for Windows, Linux and macOS and publish a GitHub
# Release. Runs automatically when a version tag (v*) is pushed, and can also
# be kicked off by hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed so the release job can create the GitHub Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # ---- Windows: activate the MSVC toolchain so Ninja finds cl.exe ----
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- Linux: tools used to build a self-contained AppImage ----
      - name: Linux deploy tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # ========================= Packaging =========================
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/ps4ufs-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/ps4ufs-qt.exe $out
          Copy-Item build/ps4ufs.exe     $out
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$out/ps4ufs-qt.exe"
          Copy-Item README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "ps4ufs-${{ matrix.name }}.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          out="dist/ps4ufs-${{ matrix.name }}"
          mkdir -p "$out"
          # AppImage for the GUI
          export QML_SOURCES_PATHS=.
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/ps4ufs-qt \
            --desktop-file packaging/ps4ufs-qt.desktop \
            --icon-file packaging/ps4ufs-qt.png \
            --plugin qt --output appimage
          mv ps4ufs-qt*.AppImage "$out/ps4ufs-qt-${{ matrix.name }}.AppImage"
          # the CLI is self-contained
          cp build/ps4ufs "$out/"
          cp README.md "$out/"
          tar -czf "ps4ufs-${{ matrix.name }}.tar.gz" -C "$out" .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out="dist/ps4ufs-${{ matrix.name }}"
          mkdir -p "$out"
          "$QT_ROOT_DIR/bin/macdeployqt" build/ps4ufs-qt.app
          cp -R build/ps4ufs-qt.app "$out/"
          cp build/ps4ufs "$out/"
          cp README.md "$out/"
          # zip preserves the .app bundle structure + symlinks
          (cd "$out" && zip -ry "../../ps4ufs-${{ matrix.name }}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4ufs-${{ matrix.name }}
          path: |
            ps4ufs-${{ matrix.name }}.zip
            ps4ufs-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
